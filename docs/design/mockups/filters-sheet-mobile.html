<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Filters sheet</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible+Next:ital,wght@0,400..800;1,400&display=swap"
    />
    <link rel="stylesheet" href="../tokens/tokens.css" />
    <link rel="stylesheet" href="components.css" />
    <style>
      body {
        overflow: hidden;
        height: 844px;
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgb(5 8 16 / 0.45);
      }
      .ib-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 88%;
        display: flex;
        flex-direction: column;
      }
      .sheet-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 16px 12px;
        border-bottom: 1px solid var(--border);
      }
      .sheet-b {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        overflow: auto;
      }
      .sheet-f {
        display: flex;
        gap: 10px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        border-top: 1px solid var(--border);
      }
      .sheet-f .ib-btn {
        flex: 1;
      }
      h3 {
        font: 700 1rem/1.3 var(--font-sans);
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body class="ib">
    <div style="filter: saturate(0.9)">
      <header class="ib-header">
        <div class="wrap ib-header__in">
          <a class="ib-logo" href="#"><span class="ib-logo__mark">IB</span>IB Match</a>
          <div class="ib-header__actions">
            <a class="ib-btn ib-btn--outline ib-btn--sm" href="#">Sign in</a>
            <button class="ib-iconbtn" aria-label="Open menu" aria-expanded="false">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="4" x2="20" y1="12" y2="12" />
                <line x1="4" x2="20" y1="6" y2="6" />
                <line x1="4" x2="20" y1="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>
      </header>
    </div>
    <div class="scrim"></div>
    <div class="ib-sheet" role="dialog" aria-modal="true" aria-labelledby="ft">
      <div class="ib-sheet__grab"></div>
      <div class="sheet-h">
        <h2 id="ft" class="t-heading-md">Filters</h2>
        <button class="ib-iconbtn" aria-label="Close filters">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div class="sheet-b">
        <section>
          <h3>Field of study</h3>
          <div class="row">
            <button class="ib-chip" aria-pressed="true">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg
              >Social Sciences</button
            ><button class="ib-chip" aria-pressed="false">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <rect width="16" height="16" x="4" y="4" rx="2" />
                <rect width="6" height="6" x="9" y="9" rx="1" />
                <path d="M15 2v2" />
                <path d="M15 20v2" />
                <path d="M2 15h2" />
                <path d="M2 9h2" />
                <path d="M20 15h2" />
                <path d="M20 9h2" />
                <path d="M9 2v2" />
                <path d="M9 20v2" /></svg
              >Computer Science</button
            ><button class="ib-chip" aria-pressed="false">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"
                />
                <path d="m14.5 12.5 2-2" />
                <path d="m11.5 9.5 2-2" />
                <path d="m8.5 6.5 2-2" />
                <path d="m17.5 15.5 2-2" /></svg
              >Engineering</button
            ><button class="ib-chip" aria-pressed="false">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                <rect width="20" height="14" x="2" y="6" rx="2" /></svg
              >Business</button
            ><button class="ib-chip" aria-pressed="false">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M11 2v2" />
                <path d="M5 2v2" />
                <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1" />
                <path d="M8 15a6 6 0 0 0 12 0v-3" />
                <circle cx="20" cy="10" r="2" /></svg
              >Medicine</button
            ><button class="ib-chip" aria-pressed="false">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
                <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
                <path d="M7 21h10" />
                <path d="M12 3v18" />
                <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></svg
              >Law
            </button>
          </div>
        </section>
        <section>
          <h3>Country</h3>
          <div class="row">
            <button class="ib-chip" aria-pressed="true">
              <span class="flag">🇬🇧</span>United Kingdom</button
            ><button class="ib-chip" aria-pressed="true">
              <span class="flag">🇳🇱</span>Netherlands</button
            ><button class="ib-chip" aria-pressed="false"><span class="flag">🇨🇦</span>Canada</button
            ><button class="ib-chip" aria-pressed="false">
              <span class="flag">🇦🇺</span>Australia</button
            ><button class="ib-chip" aria-pressed="false">
              <span class="flag">🇮🇪</span>Ireland</button
            ><button class="ib-chip" aria-pressed="false">+17 more</button>
          </div>
        </section>
        <section>
          <h3>Minimum IB points</h3>
          <div
            style="
              display: grid;
              grid-template-columns: 1fr auto 1fr;
              gap: 8px;
              align-items: center;
            "
          >
            <input class="ib-input num" value="30" aria-label="From" /><span class="muted">to</span
            ><input class="ib-input num" value="41" aria-label="To" />
          </div>
        </section>
      </div>
      <div class="sheet-f">
        <button class="ib-btn ib-btn--outline">Clear all</button
        ><button class="ib-btn ib-btn--primary">Show 47 programs</button>
      </div>
    </div>
  </body>
</html>
