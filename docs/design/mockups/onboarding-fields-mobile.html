<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Onboarding fields</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible+Next:ital,wght@0,400..800;1,400&display=swap"
    />
    <link rel="stylesheet" href="../tokens/tokens.css" />
    <link rel="stylesheet" href="components.css" />
    <style>
      .ob {
        padding-block: 20px 120px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .tiles {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .bottom .ib-btn {
        flex: 1;
      }
    </style>
  </head>
  <body class="ib">
    <header class="ib-header">
      <div class="wrap ib-header__in">
        <a class="ib-logo" href="#"><span class="ib-logo__mark">IB</span>IB Match</a>
        <div class="ib-header__actions">
          <a href="#" style="font-weight: 600; font-size: 0.9375rem">Save and exit</a>
        </div>
      </div>
    </header>
    <main class="wrap ob">
      <div class="ib-stepper">
        <div class="ib-stepper__meta">
          <span><b>Step 1 of 3</b> · Study interests</span><span>About 3 minutes</span>
        </div>
        <div class="ib-stepper__bar">
          <span data-state="current"></span><span></span><span></span>
        </div>
      </div>
      <div>
        <h1 class="t-display-lg">What would you like to study?</h1>
        <p class="muted" style="margin-top: 8px">
          Choose up to 5 fields. You can change them at any time.
        </p>
      </div>
      <div class="tiles" role="group" aria-label="Fields of study">
        <button class="ib-tile" role="checkbox" aria-checked="true">
          <span class="ib-tile__icon"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg></span
          ><span>Social Sciences<small>Psychology, politics, sociology</small></span
          ><span class="ib-tile__check"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg
          ></span></button
        ><button class="ib-tile" role="checkbox" aria-checked="true">
          <span class="ib-tile__icon"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <rect width="16" height="16" x="4" y="4" rx="2" />
              <rect width="6" height="6" x="9" y="9" rx="1" />
              <path d="M15 2v2" />
              <path d="M15 20v2" />
              <path d="M2 15h2" />
              <path d="M2 9h2" />
              <path d="M20 15h2" />
              <path d="M20 9h2" />
              <path d="M9 2v2" />
              <path d="M9 20v2" /></svg></span
          ><span>Computer Science<small>Software, AI, data</small></span
          ><span class="ib-tile__check"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg
          ></span></button
        ><button class="ib-tile" role="checkbox" aria-checked="false">
          <span class="ib-tile__icon"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
              <rect width="20" height="14" x="2" y="6" rx="2" /></svg></span
          ><span>Business & Economics<small>Economics, management, finance</small></span
          ><span class="ib-tile__check"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg
          ></span></button
        ><button class="ib-tile" role="checkbox" aria-checked="false">
          <span class="ib-tile__icon"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"
              />
              <path d="m14.5 12.5 2-2" />
              <path d="m11.5 9.5 2-2" />
              <path d="m8.5 6.5 2-2" />
              <path d="m17.5 15.5 2-2" /></svg></span
          ><span>Engineering<small>Mechanical, civil, electrical</small></span
          ><span class="ib-tile__check"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg
          ></span></button
        ><button class="ib-tile" role="checkbox" aria-checked="false">
          <span class="ib-tile__icon"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 2v2" />
              <path d="M5 2v2" />
              <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1" />
              <path d="M8 15a6 6 0 0 0 12 0v-3" />
              <circle cx="20" cy="10" r="2" /></svg></span
          ><span>Medicine & Health<small>Medicine, nursing, dentistry</small></span
          ><span class="ib-tile__check"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg
          ></span></button
        ><button class="ib-tile" role="checkbox" aria-checked="true">
          <span class="ib-tile__icon"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 2v7.31" />
              <path d="M14 9.3V1.99" />
              <path d="M8.5 2h7" />
              <path d="M14 9.3a6.5 6.5 0 1 1-4 0" />
              <path d="M5.52 16h12.96" /></svg></span
          ><span>Natural Sciences<small>Biology, chemistry, physics</small></span
          ><span class="ib-tile__check"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg
          ></span></button
        ><button class="ib-tile" role="checkbox" aria-checked="false">
          <span class="ib-tile__icon"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
              <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" />
              <path d="M7 21h10" />
              <path d="M12 3v18" />
              <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></svg></span
          ><span>Law<small>Law, legal studies</small></span
          ><span class="ib-tile__check"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg
          ></span></button
        ><button class="ib-tile" role="checkbox" aria-checked="false">
          <span class="ib-tile__icon"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"
              />
              <circle cx="13.5" cy="6.5" r=".5" />
              <circle cx="17.5" cy="10.5" r=".5" />
              <circle cx="6.5" cy="12.5" r=".5" />
              <circle cx="8.5" cy="7.5" r=".5" /></svg></span
          ><span>Arts & Humanities<small>History, languages, music</small></span
          ><span class="ib-tile__check"
            ><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg
          ></span>
        </button>
      </div>
    </main>
    <div class="bottom">
      <span class="ib-hint"><b class="num" style="color: var(--fg)">3 of 5</b> chosen</span
      ><button class="ib-btn ib-btn--primary">
        Continue<svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </button>
    </div>
  </body>
</html>
