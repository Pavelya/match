<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Onboarding grades mobile</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible+Next:ital,wght@0,400..800;1,400&display=swap"
    />
    <link rel="stylesheet" href="../tokens/tokens.css" />
    <link rel="stylesheet" href="components.css" />
    <style>
      .ob {
        padding-block: 20px 140px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .subj {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .grp {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 0.8125rem;
        color: var(--fg-muted);
      }
      .gnum {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary-soft-fg);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 0.75rem;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .two .ib-seg {
        width: 100%;
      }
      .two .ib-seg__opt {
        min-width: 0;
        padding: 0;
      }
      .bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .bottom .ib-btn {
        flex: 1;
      }
    </style>
  </head>
  <body class="ib">
    <header class="ib-header">
      <div class="wrap ib-header__in">
        <a class="ib-logo" href="#"><span class="ib-logo__mark">IB</span>IB Match</a>
        <div class="ib-header__actions">
          <a href="#" style="font-weight: 600; font-size: 0.9375rem">Save and exit</a>
        </div>
      </div>
    </header>
    <main class="wrap ob">
      <div class="ib-stepper">
        <div class="ib-stepper__meta">
          <span><b>Step 3 of 3</b> · Your IB Diploma</span>
        </div>
        <div class="ib-stepper__bar">
          <span data-state="done"></span><span data-state="done"></span
          ><span data-state="current"></span>
        </div>
      </div>
      <h1 class="t-display-lg">Subjects and predicted grades</h1>
      <div class="subj">
        <div class="grp"><span class="gnum">1</span>Studies in language and literature</div>
        <select class="ib-select" style="width: 100%">
          <option>English A: Literature</option>
        </select>
        <div class="two">
          <div class="ib-seg" role="radiogroup" aria-label="Level">
            <button class="ib-seg__opt" role="radio" aria-checked="true">HL</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">SL</button>
          </div>
          <div class="ib-seg" role="radiogroup" aria-label="Grade">
            <button class="ib-seg__opt" role="radio" aria-checked="false">1</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">2</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">3</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">4</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">5</button
            ><button class="ib-seg__opt" role="radio" aria-checked="true">6</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">7</button>
          </div>
        </div>
      </div>
      <div class="subj">
        <div class="grp"><span class="gnum">2</span>Language acquisition</div>
        <select class="ib-select" style="width: 100%">
          <option>Spanish B</option>
        </select>
        <div class="two">
          <div class="ib-seg" role="radiogroup" aria-label="Level">
            <button class="ib-seg__opt" role="radio" aria-checked="false">HL</button
            ><button class="ib-seg__opt" role="radio" aria-checked="true">SL</button>
          </div>
          <div class="ib-seg" role="radiogroup" aria-label="Grade">
            <button class="ib-seg__opt" role="radio" aria-checked="false">1</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">2</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">3</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">4</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">5</button
            ><button class="ib-seg__opt" role="radio" aria-checked="true">6</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">7</button>
          </div>
        </div>
      </div>
      <div class="subj">
        <div class="grp"><span class="gnum">3</span>Individuals and societies</div>
        <select class="ib-select" style="width: 100%">
          <option>Psychology</option>
        </select>
        <div class="two">
          <div class="ib-seg" role="radiogroup" aria-label="Level">
            <button class="ib-seg__opt" role="radio" aria-checked="true">HL</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">SL</button>
          </div>
          <div class="ib-seg" role="radiogroup" aria-label="Grade">
            <button class="ib-seg__opt" role="radio" aria-checked="false">1</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">2</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">3</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">4</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">5</button
            ><button class="ib-seg__opt" role="radio" aria-checked="false">6</button
            ><button class="ib-seg__opt" role="radio" aria-checked="true">7</button>
          </div>
        </div>
      </div>
    </main>
    <div class="bottom">
      <div>
        <p class="ib-hint" style="line-height: 1.2">Total</p>
        <p class="num" style="font: 700 1.5rem/1 var(--font-display)">
          39<span class="muted" style="font: 400 0.875rem var(--font-sans)"> /45</span>
        </p>
      </div>
      <button class="ib-btn ib-btn--primary">See my matches</button>
    </div>
  </body>
</html>
