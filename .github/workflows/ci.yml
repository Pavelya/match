name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, format
    runs-on: ubuntu-latest

    env:
      # `npm ci` triggers `prisma generate` via postinstall, which reads the
      # datasource block and needs these to be defined. It never connects,
      # so placeholder values are enough.
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgres://placeholder:placeholder@localhost:5432/placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # Warnings fail here as well as errors. The repo is at zero of both,
      # and `--max-warnings 0` is what stops warnings accumulating again the
      # way the `window.location.href` batch did.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Check formatting
        run: npx prettier --check .

  build:
    name: Production build
    runs-on: ubuntu-latest

    # Builds against a throwaway database created from prisma/migrations alone,
    # so this also proves the migration history can still reproduce the schema.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ibmatch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ibmatch_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ibmatch_ci
      # Placeholders. The build validates these through lib/env.ts but never
      # connects to any of these services - Algolia and Stripe clients are
      # constructed on first use, not at import.
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: ci@example.com
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the database from migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build
