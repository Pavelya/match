name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, format
    runs-on: ubuntu-latest

    env:
      # `npm ci` triggers `prisma generate` via postinstall, which loads
      # prisma.config.ts. That file resolves `env('DIRECT_URL')` eagerly and
      # throws if it is unset, so both must be defined. Neither is connected
      # to here, so placeholder values are enough.
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgres://placeholder:placeholder@localhost:5432/placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # Warnings fail here as well as errors. The repo is at zero of both,
      # and `--max-warnings 0` is what stops warnings accumulating again the
      # way the `window.location.href` batch did.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Check formatting
        run: npx prettier --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # Neither suite connects to a database or any external service. These are
    # the same placeholders the checks job needs for `prisma generate`.
    env:
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgres://placeholder:placeholder@localhost:5432/placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Runs even when the unit tests fail, so one red run reports both suites.
      - name: Matching algorithm tests
        if: ${{ !cancelled() }}
        run: npx tsx scripts/run-all-tests.ts

  build:
    name: Production build
    runs-on: ubuntu-latest

    # Builds against a throwaway database created from prisma/migrations alone,
    # so this also proves the migration history can still reproduce the schema.

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ibmatch_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ibmatch_ci
      # Placeholders. The build validates these through lib/env.ts but never
      # connects to any of these services - Algolia and Stripe clients are
      # constructed on first use, not at import.
      NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: ci@example.com
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder

    steps:
      # The runner's own PostgreSQL, installed on GitHub's Ubuntu images and stopped by default.
      # Nothing to download, so no registry's anonymous limit can fail the job: Docker Hub's did
      # three times running on 9 October 2026, then Amazon's public mirror ("Data limit
      # exceeded") on 16 October 2026.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          pg_isready --host localhost --timeout 30
          sudo -u postgres psql --quiet --command "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb ibmatch_ci
          sudo -u postgres psql --tuples-only --command 'SELECT version();'

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the database from migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build
